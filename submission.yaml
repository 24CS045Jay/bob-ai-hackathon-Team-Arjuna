submission:
  title: "PortFlow AI"

  problem_statement: >
    Major deepwater container terminals face unpredictable quayside bottlenecks and vessel congestion, costing global supply chains over $10B annually in demurrage penalties and idle anchored vessel hours. Existing terminal operating systems manage berths and cranes reactively in disparate spreadsheets after delays have already cascaded.

  solution_summary: >
    PortFlow AI is an end-to-end maritime operations digital twin and intelligent decision support system that combines a machine learning congestion prediction engine, a discrete berth and quay crane constraint optimizer, an alternate navigation routing recommender, a 72-hour rolling master schedule generator, and a live context-grounded AI Copilot powered by IBM watsonx.ai Granite.

  key_features:
    - "Machine Learning Congestion Prediction: RandomForest predictive model forecasting zone-specific congestion scores and top contributing factors 24–72 hours in advance."
    - "Berth Allocation & Crane Move Optimizer: Constraint satisfaction solver assigning incoming vessels to size- and type-compatible berths while minimizing waiting hours and crane transit."
    - "Alternate Channel Routing Recommender: Dijkstra waypoint navigation engine suggesting alternate port basins to avoid high-congestion chokepoints."
    - "72-Hour Rolling Master Schedule: Dynamic operational plan divided into 12 six-hour slices forecasting cargo flow, vessel turnarounds, and quayside utilization."
    - "Context-Grounded AI Copilot: Natural language assistant powered by IBM watsonx Granite (with full DEMO_MODE fallback) explaining operational decisions using live telemetry snapshots."

  tech_stack:
    languages: ["Python", "JavaScript", "SQL"]
    frameworks: ["FastAPI", "React", "Vite", "TailwindCSS", "scikit-learn"]
    ibm_technologies: ["watsonx.ai", "Granite 3-8B Instruct", "IBM Cloud Functions"]
    databases: ["SQLite", "SQLAlchemy"]
    other: ["Docker", "GitHub Actions", "Recharts", "Framer Motion", "Dijkstra Graph Algorithms"]

  what_we_are_most_proud_of: >
    The tight coupling between pure mathematical optimization heuristics and our context-grounded AI Copilot. Instead of generic conversational filler, every Copilot response references real-time vessel ETAs, actual quay crane allocations, and live congestion percentages directly from the system state.

  known_limitations: >
    The current deployment models a canonical 6-zone deepwater port (Port of Arjuna). While dynamic tide and weather coefficients are actively factored into transit delays, multi-port hinterland rail network congestion is simulated via probabilistic queue distributions rather than external railway API webhooks.

